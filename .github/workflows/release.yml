name: Release

# Builds the mod with JDK 25 (required by Minecraft 26.2) on a GitHub-hosted
# runner and publishes the remapped jar to a GitHub Release whenever a version
# tag is pushed (e.g. v5.1.2+26.2).
#
# Release notes: if docs/release-notes/<tag>.md exists it is used verbatim as
# the release body; otherwise GitHub auto-generates notes from the commit range.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build
        working-directory: mod
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Locate release jar
        id: jar
        run: |
          jar=$(ls mod/build/libs/holdmyitems-*.jar | grep -v -- '-sources.jar' | head -n1)
          if [ -z "$jar" ]; then
            echo "No release jar found in mod/build/libs/" >&2
            ls -la mod/build/libs/ || true
            exit 1
          fi
          echo "path=$jar" >> "$GITHUB_OUTPUT"
          echo "Release jar: $jar"

      - name: Resolve release notes
        id: notes
        run: |
          f="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then
            echo "path=$f" >> "$GITHUB_OUTPUT"
            echo "Using curated notes: $f"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "No curated notes for ${GITHUB_REF_NAME}; auto-generating."
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: HMI ${{ github.ref_name }}
          files: ${{ steps.jar.outputs.path }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
          fail_on_unmatched_files: true
